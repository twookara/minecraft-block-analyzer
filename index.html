<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minecraft Block Analyzer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#202020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Analyzer">
<link rel="apple-touch-icon" href="icon-192.png">





<style>
@font-face{
  font-family:"BestTen CRT";
  src:
    url("./BestTen-CRT.otf") format("opentype"),
    url("./Best10-FONT/BestTen-CRT.otf") format("opentype");
  font-display:block;
}
:root{
  font-family:"BestTen CRT","Courier New",monospace;
  --orange:#F8B400;
  --blue:#0072C3;
  --yellow:#FFE20A;
  --black:#000000;
  --white:#FFFFFF;
  --ink:#111111;
  --muted:#5d6670;
  --paper:#FFFFFF;
  --soft:#F5F7FA;
  --line:#D9E1E8;
  --green:#65C85A;
  --red:#E76060;
}
*{
  box-sizing:border-box;
  font-family:"BestTen CRT","Courier New",monospace !important;
}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    linear-gradient(180deg,#E9F4FA 0%,#F3F6F9 36%,#EDF1F4 100%);
}
.wrap{max-width:1200px;margin:auto;padding:14px 12px 44px}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 7px 18px rgba(24,50,75,.07);
}
.card:first-child{
  min-height:0; aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  border:0;
  border-radius:20px;
  padding:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  color:var(--white);
  background:
    linear-gradient(116deg,var(--orange) 0 35%,var(--blue) 35% 100%);
  box-shadow:0 13px 28px rgba(0,82,140,.20);
}
.card:first-child:before{display:none}
.card:first-child:after{display:none}

h2{
  font-size:18px;
  margin:0 0 12px;
  font-weight:400;
  letter-spacing:0;
}
.small{
  font-size:11px;
  line-height:1.55;
  color:var(--muted);
}
.card:first-child .small{
  position:relative;
  z-index:2;
  color:var(--white);
  font-size:12px;
  text-shadow:0 1px 2px rgba(0,0,0,.2);
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,input,textarea{font:inherit}
button{
  min-height:42px;
  padding:9px 13px;
  border:2px solid #20242A;
  border-radius:9px;
  background:#FFFFFF;
  color:#151515;
  font-weight:400;
  box-shadow:0 4px 0 #20242A;
}
button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #20242A;
}
button.primary{
  background:var(--yellow);
  color:#000;
  border-color:#000;
  box-shadow:0 4px 0 #000;
}
button.primary:active{box-shadow:0 1px 0 #000}
button:disabled{opacity:.4;box-shadow:none}
input[type=file]{
  max-width:100%;
  padding:7px;
  border:2px dashed #AEBBC7;
  border-radius:9px;
  background:#F7FAFD;
}
input[type=text],textarea{
  padding:10px 11px;
  border:2px solid #BBC7D1;
  border-radius:9px;
  background:#FFFFFF;
  color:#111;
  outline:none;
}
input[type=text]:focus,textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,114,195,.13);
}
textarea{width:100%;min-height:100px;resize:vertical}
.status,.dictStat{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:999px;
  background:#E7F3FC;
  color:#005B9A;
  border:1px solid #BEDDF2;
  font-size:10px;
}
.list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(286px,1fr));
  gap:11px;
}
.item{
  position:relative;
  padding:11px;
  border:1px solid #DCE4EC;
  border-radius:13px;
  background:#FFF;
  box-shadow:0 5px 14px rgba(35,58,82,.055);
  overflow:hidden;
}
.item:after{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:4px;
  background:#B8C6D4;
}
.item.ok:after{background:var(--green)}
.item.warn:after{background:var(--orange)}
.item.fail:after{background:var(--red)}
.thumb{
  width:112px;
  height:112px;
  image-rendering:pixelated;
  border:2px solid #30343A;
  border-radius:8px;
  background:
    linear-gradient(45deg,#E8EBEE 25%,transparent 25%),
    linear-gradient(-45deg,#E8EBEE 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#E8EBEE 75%),
    linear-gradient(-45deg,transparent 75%,#E8EBEE 75%),
    #FFF;
  background-size:16px 16px;
  background-position:0 0,0 8px,8px -8px,-8px 0;
  margin-bottom:7px;
}
.nameInput,.idInput{width:100%;margin-top:6px}
.badge{
  display:inline-flex;
  margin-left:7px;
  padding:4px 7px;
  border-radius:999px;
  font-size:10px;
}
.badge.ok{background:#E2F7E4;color:#277A2C}
.badge.warn{background:#FFF0CB;color:#8B5C00}
.badge.fail{background:#FFE2E2;color:#9D3333}
.grid2{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);
  gap:12px;
}
canvas{
  max-width:100%;
  border:2px solid #30343A;
  border-radius:10px;
  background:#20272A;
  touch-action:none;
}
#editPreview{
  width:180px;
  height:180px;
  image-rendering:pixelated;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(20,29,40,.72);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.modalBox{
  background:#FFF;
  max-width:960px;
  width:100%;
  max-height:94vh;
  overflow:auto;
  border-radius:17px;
  padding:15px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);
}
#loupeWrap{
  position:fixed;
  right:12px;
  top:12px;
  z-index:150;
  display:none;
  background:#FFF;
  border:2px solid #30343A;
  border-radius:11px;
  padding:6px;
  pointer-events:none;
}
#loupe{
  width:180px;
  height:180px;
  border-radius:8px;
  border:0;
  background:#111;
  image-rendering:pixelated;
}
.helpCompact{
  margin-top:7px;
  border-top:1px solid #E4E9EF;
}
.helpCompact summary{
  cursor:pointer;
  list-style:none;
  padding:6px 1px 3px;
  font-size:9px;
  color:#89919B;
}
.helpCompact summary::-webkit-details-marker{display:none}
.helpCompact summary:after{content:" ＋"}
.helpCompact[open] summary:after{content:" −"}
.helpCompact .small{
  padding:2px 0 3px;
  font-size:9px;
  color:#9198A1;
}
.suggest{
  position:absolute;
  left:11px;
  right:11px;
  z-index:20;
  background:#FFF;
  border:2px solid #20242A;
  border-radius:10px;
  box-shadow:4px 4px 0 rgba(32,36,42,.28);
  max-height:min(52vh,420px);
  overflow:auto;
  display:none;
}
.suggest button{
  width:100%;
  border:0;
  border-bottom:1px solid #EDF0F4;
  border-radius:0;
  text-align:left;
  padding:9px 10px;
  background:#FFF;
  box-shadow:none;
}
.item>.small{
  margin:2px 0 4px;
  font-size:10px;
}
.item>button{margin-top:7px;margin-right:5px}
.card:nth-of-type(2) h2:before,
.card:nth-of-type(3) h2:before,
.card:nth-of-type(4) h2:before,
.card:nth-of-type(5) h2:before{
  display:inline-grid;
  place-items:center;
  width:25px;
  height:25px;
  margin-right:8px;
  border-radius:7px;
  background:var(--orange);
  color:#000;
  border:2px solid #000;
  box-shadow:2px 2px 0 #000;
  font-size:10px;
}
.card:nth-of-type(2) h2:before{content:"01"}
.card:nth-of-type(3) h2:before{content:"02";background:var(--blue);color:#FFF}
.card:nth-of-type(4) h2:before{content:"03";background:#65C85A}
.card:nth-of-type(5) h2:before{content:"04";background:var(--yellow)}
@media(max-width:800px){
  .wrap{padding:10px 9px 32px}
  .card{padding:14px;border-radius:14px}
  .card:first-child{min-height:0; aspect-ratio:16/9;padding:0}
  
  .grid2{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
  .thumb{width:106px;height:106px}
  button{min-height:44px}
}

.headerImageWrap{
  position:absolute;
  inset:0;
  z-index:1;
  overflow:hidden;
}
.headerImage{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.card:first-child .small{
  display:none !important;
}


/* Logo-palette page theme */
:root{
  --logo-blue:#1689F4;
  --logo-blue-dark:#0067B8;
  --logo-blue-light:#DDF1FF;
  --logo-orange:#FFAA00;
  --logo-orange-dark:#E78C00;
  --logo-orange-light:#FFF0C9;
  --logo-yellow:#FFE928;
  --logo-black:#171717;
  --logo-white:#FFFFFF;
  --ink:#171717;
  --muted:#5D6670;
  --paper:#FFFFFF;
  --soft:#F4F8FC;
  --line:#C9D9E6;
  --green:#72C95B;
  --red:#E76060;
}
body{
  background:
    radial-gradient(circle at 12% 4%,rgba(255,233,40,.28),transparent 20%),
    radial-gradient(circle at 88% 8%,rgba(22,137,244,.20),transparent 24%),
    linear-gradient(135deg,#FFF0C9 0 18%,#F8FBFF 18% 64%,#DDF1FF 64% 100%);
  background-attachment:fixed;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle,rgba(255,170,0,.20) 0 3px,transparent 3.5px) 14px 16px/22px 22px,
    linear-gradient(135deg,transparent 0 78%,rgba(0,103,184,.055) 78% 82%,transparent 82% 100%);
  mask-image:linear-gradient(90deg,#000 0 14%,transparent 30% 72%,#000 90%);
  -webkit-mask-image:linear-gradient(90deg,#000 0 14%,transparent 30% 72%,#000 90%);
}
.card:not(:first-child){
  background:rgba(255,255,255,.96);
  border-color:#C9D9E6;
  box-shadow:0 7px 18px rgba(0,103,184,.09);
}
.card:nth-of-type(2){border-top:5px solid var(--logo-orange)}
.card:nth-of-type(3){border-top:5px solid var(--logo-blue)}
.card:nth-of-type(4){border-top:5px solid var(--logo-yellow)}
.card:nth-of-type(5){border-top:5px solid var(--logo-blue-dark)}
button{
  border-color:#26333D;
  background:#FFFFFF;
  color:#171717;
  box-shadow:0 4px 0 #26333D;
}
button.primary{
  background:var(--logo-yellow);
  color:#111;
  border-color:var(--logo-black);
  box-shadow:0 4px 0 var(--logo-black);
}
input[type=text],textarea{
  background:#FFFFFF;
  border-color:#AFC8DA;
}
input[type=text]:focus,textarea:focus{
  border-color:var(--logo-blue);
  box-shadow:0 0 0 3px rgba(22,137,244,.14);
}
.status,.dictStat{
  background:var(--logo-blue-light);
  color:#005EAA;
  border-color:#A8D5F4;
}
.helpCompact{
  border-top-color:#D3E3EE;
}
.suggest{
  border-color:#26333D;
}
.card:nth-of-type(2) h2:before{background:var(--logo-orange);color:#111}
.card:nth-of-type(3) h2:before{background:var(--logo-blue);color:#fff}
.card:nth-of-type(4) h2:before{background:var(--logo-yellow);color:#111}
.card:nth-of-type(5) h2:before{background:var(--logo-blue-dark);color:#fff}


/* Large autocomplete candidate panel */
.suggest,
.suggestions,
.autocomplete-list,
.autocomplete-results,
.dropdown-list,
.search-suggestions {
  max-height: min(52vh, 420px) !important;
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
}
.suggest > *,
.suggestions > *,
.autocomplete-list > *,
.autocomplete-results > *,
.dropdown-list > *,
.search-suggestions > * {
  min-height: 44px;
}



/* Balanced result cards */
.item{
  position:relative;
  display:grid;
  grid-template-columns:112px minmax(0,1fr);
  gap:12px;
  align-items:start;
  overflow:visible !important;
  padding:12px;
}
.item .thumb{
  width:112px;
  height:112px;
  margin:0;
}
.resultMain{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.resultMain .badge{
  align-self:flex-start;
  margin:0;
  position:static;
}
.nameFieldWrap{
  position:relative;
  min-width:0;
}
.nameFieldWrap .nameInput,
.resultMain .idInput{
  width:100%;
  margin:0;
}
.nameFieldWrap .suggest{
  left:0;
  right:0;
  top:calc(100% + 4px);
  max-height:min(42vh,360px) !important;
  overflow-y:auto !important;
  z-index:80;
}
.resultActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:1px;
}
.resultActions button{
  min-height:40px;
  padding:7px 9px;
  margin:0 !important;
  font-size:12px;
  box-shadow:2px 2px 0 #24313A;
}
.item:focus-within{z-index:70}

@media(max-width:800px){
  .item{
    grid-template-columns:96px minmax(0,1fr);
    gap:10px;
    padding:10px;
  }
  .item .thumb{
    width:96px;
    height:96px;
  }
  .resultMain{gap:6px}
  .resultActions{gap:6px}
  .resultActions button{
    min-height:36px;
    padding:6px 7px;
    font-size:11px;
  }
  .nameFieldWrap .suggest{
    max-height:min(36vh,300px) !important;
  }
}


/* Two-step flow: upload page -> results page */
.view{display:none}
.view.active{display:block}
#uploadView .card{max-width:760px;margin-left:auto;margin-right:auto}
#resultsView .topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:8px 0 14px;
}
#resultsView .topbar button{
  min-height:38px;
  padding:7px 12px;
  font-size:12px;
}


/* iPhone / PWA top safe-area spacing */
:root{
  --app-safe-top: env(safe-area-inset-top, 0px);
}
body{
  padding-top: calc(var(--app-safe-top) + 14px);
}
header,
.header,
.hero,
.logoWrap,
.header-logo-wrap{
  scroll-margin-top: calc(var(--app-safe-top) + 14px);
}
@media (display-mode: standalone){
  body{
    padding-top: calc(var(--app-safe-top) + 18px);
  }
}

</style>





</head>
<body>
<div class="wrap">
<section id="uploadView" class="view active">
<div class="card">
<div class="headerImageWrap"><img class="headerImage" src="./header-logo.png" alt="Minecraft Block Analyzer"></div>
<div class="small">撮影したブロックを、切り出し・色解析・ID整理までまとめて処理。</div>
</div>

<div class="card">
<h2>スクリーンショット</h2>
<div class="row">
<input id="files" type="file" accept="image/*" multiple>
<button id="analyzeAll" class="primary">一括解析</button>
<button id="clearAll">全消去</button>
<span id="batchStatus" class="status">画像を選択してください</span>
</div>
<details class="helpCompact"><summary>精度を優先する場合</summary><div class="small">最初の1枚を手動補正し、「この範囲を全画像に適用」。保存範囲は次回の検出基準にも使われます。</div></details>
</div>


</section>
<section id="resultsView" class="view">
<div class="topbar"><button id="backToUpload" type="button">← 画像選択へ戻る</button><span class="small">解析結果</span></div>
<div class="card">
<h2>解析結果</h2>
<div id="results" class="list"></div>
</div>

<div class="card">
<h2>書き出し</h2>
<div class="row"><button id="exportJson" disabled>JSON</button><button id="exportCsv" disabled>CSV</button><button id="exportZip" class="primary" disabled>まとめてZIP保存</button></div>
</div>
</div>

<div id="editModal" class="modal">
<div class="modalBox">
<div class="row" style="justify-content:space-between"><strong id="editTitle">手動補正</strong><button id="closeEdit">閉じる</button></div>
<div class="grid2" style="margin-top:10px">
<div><canvas id="editCanvas"></canvas></div>
<div>
<div class="small">黄色＝四隅、青＝辺中央。上下辺は上下方向のみ、左右辺は左右方向のみ動きます。</div>
<canvas id="editPreview" width="16" height="16"></canvas>
<div class="row" style="margin-top:9px">
<button id="autoThis">この画像を高精度再検出</button>
<button id="saveEdit" class="primary">この補正を保存</button>
</div>
<div class="row" style="margin-top:8px"><button id="applyAll">この範囲を全画像に適用</button></div>
</div>
</div>
</div>
</div>
<div id="loupeWrap"><canvas id="loupe" width="180" height="180"></canvas></div>


</section>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js">
function refreshAnalyzeButton(){
  const fileInput =
    document.querySelector('input[type="file"][multiple]') ||
    document.querySelector('input[type="file"]');
  const btn =
    document.getElementById('analyzeAllBtn') ||
    document.getElementById('runAll') ||
    document.querySelector('button[data-action="analyze-all"]') ||
    [...document.querySelectorAll('button')].find(b=>/一括解析|解析開始/.test(b.textContent||''));
  if(btn && fileInput){
    btn.disabled = !(fileInput.files && fileInput.files.length > 0);
  }
}
document.addEventListener('change',e=>{
  if(e.target && e.target.matches('input[type="file"]')) refreshAnalyzeButton();
});
document.addEventListener('DOMContentLoaded',refreshAnalyzeButton);

const uploadView=document.getElementById('uploadView');
const resultsView=document.getElementById('resultsView');
const backToUpload=document.getElementById('backToUpload');
function showUpload(){
  uploadView.classList.add('active');
  resultsView.classList.remove('active');
  window.scrollTo({top:0,behavior:'auto'});
}
function showResults(){
  uploadView.classList.remove('active');
  resultsView.classList.add('active');
  window.scrollTo({top:0,behavior:'auto'});
}
backToUpload?.addEventListener('click',showUpload);
</script>

// Merge any user-added/local dictionary entries instead of replacing the bundled dictionary.
try{
  const saved=JSON.parse(localStorage.getItem('mcba_v09_dict')||'null');
  if(Array.isArray(saved)){
    const byId=new Map(BASE_DICT.map(e=>[e.id,e]));
    for(const e of saved){
      if(!e||!e.id||!e.name)continue;
      if(byId.has(e.id)){
        const base=byId.get(e.id);
        const aliases=[...(base.aliases||[]),...(e.aliases||[])];
        base.aliases=[...new Set(aliases.filter(Boolean))];
      }else{
        byId.set(e.id,e);
      }
    }
    DICT=[...byId.values()];
  }
}catch{}
function persistDict(){localStorage.setItem('mcba_v09_dict',JSON.stringify(DICT));updateDictStat()}
function updateDictStat(){$('dictStat').textContent=`名称辞書 ${DICT.length}件`}
updateDictStat();

function normText(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/[・･_\-]/g,'')}
function dictMatches(q,limit=8){
 q=normText(q);if(!q)return[];
 let scored=[];
 for(const e of DICT){
   let fields=[e.name,e.id,...(e.aliases||[])];
   let best=999;
   for(const f of fields){let n=normText(f);if(n===q)best=Math.min(best,0);else if(n.startsWith(q))best=Math.min(best,1+(n.length-q.length)/100);else if(n.includes(q))best=Math.min(best,2+n.indexOf(q)/100);else if(q.includes(n))best=Math.min(best,3)}
   if(best<999)scored.push([best,e]);
 }
 return scored.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name,'ja')).slice(0,limit).map(x=>x[1]);
}
function exactEntry(q){let n=normText(q);return DICT.find(e=>[e.name,e.id,...(e.aliases||[])].some(x=>normText(x)===n))||null}

function safeBase(fn){return fn.replace(/\.[^.]+$/,'')}
function cleanDisplay(s){return s.replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()}
function slug(s){return s.normalize('NFKC').toLowerCase().replace(/[^a-z0-9_ -]/g,'').trim().replace(/[ -]+/g,'_').replace(/_+/g,'_')||'block'}
function clonePts(p){return p.map(q=>({x:q.x,y:q.y}))}
function getCal(){try{let p=JSON.parse(localStorage.getItem('mcba_v09_cal'));return Array.isArray(p)&&p.length===4?p:null}catch{return null}}
function setButtons(){let on=items.length>0;$('analyzeAll').disabled=!on;$('exportJson').disabled=!on;$('exportCsv').disabled=!on;$('exportZip').disabled=!on}

filesInput.onchange=async e=>{
 items=[];
refreshAnalyzeButton();
 for(const f of [...e.target.files]){
   const url=URL.createObjectURL(f),img=new Image();
   await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
   let base=cleanDisplay(safeBase(f.name));
   let ex=exactEntry(base);
   items.push({file:f,url,img,name:ex?ex.name:base,minecraft_id:ex?ex.id:'',status:'未解析',statusClass:'warn',points:getCal()||clonePts(DEFAULT),confidence:null,pngBlob:null,colors:null});
 }
 batchStatus.textContent=`${items.length}枚を読み込みました`;
 render();setButtons();
};

function attachSuggest(input,idInput,box,it){
 const show=()=>{
   const ms=dictMatches(input.value);
   box.innerHTML='';
   if(!ms.length){box.style.display='none';return}
   for(const e of ms){
     const b=document.createElement('button');
     b.innerHTML=`<strong>${e.name}</strong><br><span class="small">${e.id}</span>`;
     b.onclick=()=>{input.value=e.name;idInput.value=e.id;it.name=e.name;it.minecraft_id=e.id;box.style.display='none'};
     box.appendChild(b);
   }
   box.style.display='block';
 };
 input.oninput=()=>{it.name=input.value;let ex=exactEntry(input.value);if(ex){idInput.value=ex.id;it.minecraft_id=ex.id}show()};
 input.onfocus=show;
 input.onblur=()=>setTimeout(()=>box.style.display='none',180);
}
function render(){

// ---------- High precision line-fit detector ----------
function grayData(img,maxW=900){
 const scale=Math.min(1,maxW/img.width),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d',{willReadFrequently:true});c.drawImage(img,0,0,w,h);
 const d=c.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
 for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=.299*d[i]+.587*d[i+1]+.114*d[i+2];
 let t=new Float32Array(g.length),b=new Float32Array(g.length);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let k=-2;k<=2;k++){let xx=x+k;if(xx>=0&&xx<w){s+=g[y*w+xx];n++}}t[y*w+x]=s/n}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let k=-2;k<=2;k++){let yy=y+k;if(yy>=0&&yy<h){s+=t[yy*w+x];n++}}b[y*w+x]=s/n}
 const gx=new Float32Array(g.length),gy=new Float32Array(g.length);
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let k=y*w+x;gx[k]=Math.abs(b[k+1]-b[k-1]);gy[k]=Math.abs(b[k+w]-b[k-w])}
 return{w,h,g:b,gx,gy};
}
function median(a){let b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]||0}
function robustLine(points,mode){ // mode x_of_y or y_of_x
 if(points.length<8)return null;
 let pts=[...points];
 for(let iter=0;iter<3;iter++){
   let sx=0,sy=0,sxx=0,sxy=0,n=pts.length;
   for(const p of pts){let X=mode==='x_of_y'?p.y:p.x,Y=mode==='x_of_y'?p.x:p.y;sx+=X;sy+=Y;sxx+=X*X;sxy+=X*Y}
   let den=n*sxx-sx*sx;if(Math.abs(den)<1e-9)return null;
   let a=(n*sxy-sx*sy)/den,b=(sy-a*sx)/n;
   let rs=pts.map(p=>{let X=mode==='x_of_y'?p.y:p.x,Y=mode==='x_of_y'?p.x:p.y;return Math.abs(Y-(a*X+b))});
   let m=median(rs),thr=Math.max(1.5,m*2.8);
   pts=pts.filter((p,i)=>rs[i]<=thr);
   if(iter===2||pts.length<10){
     let rmse=Math.sqrt(rs.reduce((s,r)=>s+r*r,0)/Math.max(1,rs.length));
     return{a,b,rmse,n:pts.length};
   }
 }
}
function sampleEdgePoints(dat,side,prior){
 const {w,h,gx,gy}=dat,p=prior||DEFAULT,pts=[];
 if(side==='left'||side==='right'){
   const pi=side==='left'?0:1;
   let center=p[pi].x*w,band=.075*w,y0=.20*h,y1=.80*h;
   for(let y=Math.round(y0);y<=Math.round(y1);y+=3){
     let best={s:-1,x:center};
     for(let x=Math.round(center-band);x<=Math.round(center+band);x++){
       if(x<2||x>=w-2)continue;let s=gx[y*w+x];
       if(s>best.s)best={s,x};
     }
     // Require locally meaningful edge
     if(best.s>4)pts.push({x:best.x,y,score:best.s});
   }
 }else{
   const pi=side==='top'?0:3;
   let center=p[pi].y*h,band=.09*h,x0=.38*w,x1=.62*w;
   // if prior width differs, use inner central section based on prior
   x0=(p[0].x+(p[1].x-p[0].x)*.18)*w;x1=(p[0].x+(p[1].x-p[0].x)*.82)*w;
   for(let x=Math.round(x0);x<=Math.round(x1);x+=3){
     let best={s:-1,y:center};
     for(let y=Math.round(center-band);y<=Math.round(center+band);y++){
       if(y<2||y>=h-2)continue;let s=gy[y*w+x];
       if(s>best.s)best={s,y};
     }
     if(best.s>4)pts.push({x,y:best.y,score:best.s});
   }
 }
 return pts;
}
function intersect(l1,mode1,l2,mode2){
 // l1 x=a*y+b and l2 y=c*x+d
 let a=l1.a,b=l1.b,c=l2.a,d=l2.b;
 let den=1-a*c;if(Math.abs(den)<1e-8)return null;
 let x=(a*d+b)/den,y=c*x+d;return{x,y};
}
function autoDetectSingle(img,p){
 const d=grayData(img),{w,h}=d;
 let lp=sampleEdgePoints(d,'left',p),rp=sampleEdgePoints(d,'right',p),tp=sampleEdgePoints(d,'top',p),bp=sampleEdgePoints(d,'bottom',p);
 let L=robustLine(lp,'x_of_y'),R=robustLine(rp,'x_of_y'),T=robustLine(tp,'y_of_x'),B=robustLine(bp,'y_of_x');
 if(!L||!R||!T||!B)return{points:clonePts(p),confidence:0};
 let c0=intersect(L,'x_of_y',T,'y_of_x'),c1=intersect(R,'x_of_y',T,'y_of_x'),c2=intersect(R,'x_of_y',B,'y_of_x'),c3=intersect(L,'x_of_y',B,'y_of_x');
 let raw=[c0,c1,c2,c3],pts=raw.map(q=>({x:q.x/w,y:q.y/h}));
 let widths=[pts[1].x-pts[0].x,pts[2].x-pts[3].x],heights=[pts[3].y-pts[0].y,pts[2].y-pts[1].y];
 let geom=(Math.min(...widths)>.18&&Math.max(...widths)<.50&&Math.min(...heights)>.48&&Math.max(...heights)<.88)?1:.2;
 let support=Math.min(1,(L.n+R.n+T.n+B.n)/180);
 let rm=(L.rmse+R.rmse+T.rmse+B.rmse)/4;
 let fit=Math.max(0,Math.min(1,1-rm/5));
 let drift=0;
 for(let i=0;i<4;i++)drift+=Math.hypot(pts[i].x-p[i].x,pts[i].y-p[i].y);
 drift/=4;
 let driftScore=Math.max(0,1-drift/.10);
 let confidence=Math.max(0,Math.min(1,geom*(.5*fit+.3*support+.2*driftScore)));
 return{points:pts,confidence,debug:{rmse:rm,support}};
}

function autoDetect(img,prior=null){
 const saved = prior || getCal();
 const candidates = [];
 if(saved) candidates.push(autoDetectSingle(img,saved));
 candidates.push(autoDetectSingle(img,DEFAULT));
 let best=candidates[0];
 for(const c of candidates){
   if(!best || c.confidence>best.confidence) best=c;
 }
 return best;
}


function solve(A,b){let n=b.length,M=A.map((r,i)=>r.concat(b[i]));for(let i=0;i<n;i++){let m=i;for(let j=i+1;j<n;j++)if(Math.abs(M[j][i])>Math.abs(M[m][i]))m=j;[M[i],M[m]]=[M[m],M[i]];let d=M[i][i];if(Math.abs(d)<1e-12)return null;for(let k=i;k<=n;k++)M[i][k]/=d;for(let j=0;j<n;j++)if(j!==i){let f=M[j][i];for(let k=i;k<=n;k++)M[j][k]-=f*M[i][k]}}return M.map(r=>r[n])}
function H(from,to){let A=[],b=[];for(let i=0;i<4;i++){let{x,y}=from[i],u=to[i].x,v=to[i].y;A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}let h=solve(A,b);return h?[...h,1]:null}
function inv(m){let[a,b,c,d,e,f,g,h,i]=m,A=e*i-f*h,B=-(d*i-f*g),Cc=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,F=-(a*h-b*g),G=b*f-c*e,Hh=-(a*f-c*d),I=a*e-b*d,det=a*A+b*B+c*Cc;return[A/det,D/det,G/det,B/det,E/det,Hh/det,Cc/det,F/det,I/det]}
function mp(h,x,y){let z=h[6]*x+h[7]*y+h[8];return{x:(h[0]*x+h[1]*y+h[2])/z,y:(h[3]*x+h[4]*y+h[5])/z}}
function normToPx(norm,w,h){return norm.map(p=>({x:p.x*w,y:p.y*h}))}

function make16(it){
 const src=document.createElement('canvas'),sc=src.getContext('2d',{willReadFrequently:true});src.width=it.img.width;src.height=it.img.height;sc.drawImage(it.img,0,0);
 const sd=sc.getImageData(0,0,src.width,src.height).data,out=document.createElement('canvas');out.width=16;out.height=16;
 const oc=out.getContext('2d'),od=oc.createImageData(16,16),pts=normToPx(it.points,src.width,src.height);
 const hh=H(pts,[{x:0,y:0},{x:16,y:0},{x:16,y:16},{x:0,y:16}]);if(!hh)throw Error('homography');const hi=inv(hh),samples=4;
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){let rr=0,gg=0,bb=0,n=0;for(let sy=0;sy<samples;sy++)for(let sx=0;sx<samples;sx++){let q=mp(hi,x+(sx+.5)/samples,y+(sy+.5)/samples),ix=Math.max(0,Math.min(src.width-1,Math.floor(q.x))),iy=Math.max(0,Math.min(src.height-1,Math.floor(q.y))),k=(iy*src.width+ix)*4;rr+=sd[k];gg+=sd[k+1];bb+=sd[k+2];n++}let k=(y*16+x)*4;od.data[k]=Math.round(rr/n);od.data[k+1]=Math.round(gg/n);od.data[k+2]=Math.round(bb/n);od.data[k+3]=255}
 oc.putImageData(od,0,0);return new Promise(r=>out.toBlob(b=>r({canvas:out,blob:b}),'image/png'));
}
function hsv(r,g,b){r/=255;g/=255;b/=255;let mx=Math.max(r,g,b),mn=Math.min(r,g,b),dd=mx-mn,h=0;if(dd){if(mx===r)h=((g-b)/dd)%6;else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;h*=60;if(h<0)h+=360}return[h,mx?dd/mx*100:0,mx*100]}
function lab(r,g,b){let a=[r,g,b].map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92}),X=(a[0]*.4124+a[1]*.3576+a[2]*.1805)/.95047,Y=a[0]*.2126+a[1]*.7152+a[2]*.0722,Z=(a[0]*.0193+a[1]*.1192+a[2]*.9505)/1.08883;a=[X,Y,Z].map(v=>v>.008856?Math.cbrt(v):7.787*v+16/116);return[116*a[1]-16,500*(a[0]-a[1]),200*(a[1]-a[2])]}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}
function extractColors(canvas){let d=canvas.getContext('2d').getImageData(0,0,16,16).data,cs=[];for(let i=0;i<d.length;i+=4){let rgb=[d[i],d[i+1],d[i+2]],l=lab(...rgb),best=-1,bd=1e9;cs.forEach((c,j)=>{let z=dist(l,c.lab);if(z<bd){bd=z;best=j}});if(best>=0&&bd<10){let c=cs[best];c.n++;c.sum=c.sum.map((v,k)=>v+rgb[k]);c.rgb=c.sum.map(v=>v/c.n);c.lab=lab(...c.rgb)}else cs.push({n:1,sum:[...rgb],rgb:[...rgb],lab:l})}cs.sort((a,b)=>b.n-a.n);return cs.slice(0,2).map(c=>{let rgb=c.rgb.map(Math.round);return{rgb,hsv:hsv(...rgb).map(v=>+v.toFixed(2)),lab:lab(...rgb).map(v=>+v.toFixed(2)),ratio:+(c.n/256).toFixed(4)}})}

}

const editModal=$('editModal'),EC=$('editCanvas'),E=EC.getContext('2d'),EP=$('editPreview'),EPC=EP.getContext('2d'),loupeWrap=$('loupeWrap'),LC=$('loupe').getContext('2d');
function openEdit(i){currentEdit=i;editImg=items[i].img;let s=Math.min(880/editImg.width,650/editImg.height,1);EC.width=Math.round(editImg.width*s);EC.height=Math.round(editImg.height*s);editPts=normToPx(items[i].points,EC.width,EC.height);$('editTitle').textContent=`手動補正：${items[i].name}`;editModal.style.display='flex';drawEdit();previewEdit()}

function epos(e){let r=EC.getBoundingClientRect();return{x:(e.clientX-r.left)*EC.width/r.width,y:(e.clientY-r.top)*EC.height/r.height}}
function ehit(p){let rad=30*EC.width/EC.getBoundingClientRect().width;for(let i=0;i<4;i++)if(Math.hypot(p.x-editPts[i].x,p.y-editPts[i].y)<rad)return{type:'point',i,last:p};for(let i=0;i<4;i++){let j=(i+1)%4,m={x:(editPts[i].x+editPts[j].x)/2,y:(editPts[i].y+editPts[j].y)/2};if(Math.hypot(p.x-m.x,p.y-m.y)<rad)return{type:'edge',i,j,last:p}}return null}
function showLoupe(p){loupeWrap.style.display='block';LC.clearRect(0,0,180,180);let ss=36,sx=Math.max(0,Math.min(EC.width-ss,p.x-ss/2)),sy=Math.max(0,Math.min(EC.height-ss,p.y-ss/2));LC.imageSmoothingEnabled=false;LC.drawImage(EC,sx,sy,ss,ss,0,0,180,180);LC.strokeStyle='#ff2d55';LC.lineWidth=2;LC.beginPath();LC.moveTo(90,0);LC.lineTo(90,180);LC.moveTo(0,90);LC.lineTo(180,90);LC.stroke()}
EC.onpointerdown=e=>{let p=epos(e);drag=ehit(p);if(drag){EC.setPointerCapture(e.pointerId);showLoupe(p)}};
EC.onpointermove=e=>{if(!drag)return;let p=epos(e),dx=p.x-drag.last.x,dy=p.y-drag.last.y;
 if(drag.type==='point'){
   editPts[drag.i].x+=dx;editPts[drag.i].y+=dy
 }else{
   // edge 0/2 = top/bottom: move only vertically.
   // edge 1/3 = right/left: move only horizontally.
   if(drag.i===0||drag.i===2){
     editPts[drag.i].y+=dy;editPts[drag.j].y+=dy
   }else{
     editPts[drag.i].x+=dx;editPts[drag.j].x+=dx
   }
 }

};
EC.onpointerup=EC.onpointercancel=()=>{drag=null;loupeWrap.style.display='none'};

$('autoThis').onclick=()=>{let prior=editPts.map(p=>({x:p.x/EC.width,y:p.y/EC.height})),a=autoDetect(editImg,prior);editPts=normToPx(a.points,EC.width,EC.height);drawEdit();previewEdit();batchStatus.textContent=`高精度再検出 信頼度 ${Math.round(a.confidence*100)}%`};
$('saveEdit').onclick=async()=>{let it=items[currentEdit];it.points=editPts.map(p=>({x:p.x/EC.width,y:p.y/EC.height}));it.confidence=1;let r=await make16(it);it.pngBlob=r.blob;it.colors=extractColors(r.canvas);it.status='成功';it.statusClass='ok';editModal.style.display='none';render();batchStatus.textContent='補正を保存しました'};
$('applyAll').onclick=async()=>{let p=editPts.map(q=>({x:q.x/EC.width,y:q.y/EC.height}));localStorage.setItem('mcba_v09_cal',JSON.stringify(p));for(let i=0;i<items.length;i++){items[i].points=clonePts(p);items[i].confidence=1;let r=await make16(items[i]);items[i].pngBlob=r.blob;items[i].colors=extractColors(r.canvas);items[i].status='成功';items[i].statusClass='ok'}editModal.style.display='none';render();batchStatus.textContent='基準範囲を保存し、全画像へ適用しました'};

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}))}
</script>

<script>
window.addEventListener("load", async () => {
  try {
    await document.fonts.load('16px "BestTen CRT"');
    const ok = document.fonts.check('16px "BestTen CRT"');
    document.documentElement.dataset.bestTenFont = ok ? "loaded" : "missing";
    if (!ok) console.warn("BestTen-CRT.otf が見つかりません。GitHub Pages上にフォントファイルを配置してください。");
  } catch (e) {
    document.documentElement.dataset.bestTenFont = "missing";
    console.warn("BestTen font load error", e);
  }
});
</script>
